[project]
name = "syntopica-brain"
version = "0.1.0"
description = "The wiki engine: index, link graph, lint, doctor and the retrieval evaluation harness"
requires-python = ">=3.12"
dependencies = [

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The tools are scripts, not an installable package: nothing here is imported
# by name from outside, so there is nothing to build a wheel from.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.deptry]
# Sibling modules the tools import by bare name, the way a script run from its
# own directory sees them. Generated from this tree by
# `tools/migration/first_party_modules.py`; a list inherited from elsewhere
# names files that are not here, and a rule that can never fire reads as a rule
# that passes.
known_first_party = [
  "keyword_scores",
  "load_pages",
  "page_text",
  "pagerank_scores",
  "query_terms",
  "recall_at_k",
  "stop_words",
  "tools",
  "top_pages",
]

[tool.deptry.per_rule_ignores]
DEP004 = ["pytest", "pytest_asyncio", "pytest_cov"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 19

[dependency-groups]
quality = [
  "busirocket-baseline-py>=0.1,<1",
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
]

# `uv sync` installs the `dev` group and no other, so a group named anything
# else is a group a fresh clone does not get. Measured on the published tree:
# `uv sync` reported "Installed 1 package" and both `pytest` and `baseline-py`
# were then missing, which makes the one command the README gives a stranger
# the command that cannot work.
[tool.uv]
default-groups = ["quality"]
