# Ground truth for the retrieval eval: a question, and the pages that should
# answer it. Hand-written on 2026-08-04, not generated - a set generated from
# the pages measures whether the generator read the same page twice.
#
# `expected_pages = []` is a refusal case: the wiki holds nothing on it, and a
# baseline that returns five confident pages anyway has failed. Those are the
# questions that make the number mean something, so keep some.
#
# Three questions deliberately target pages that link to no other page, which
# `tools/graph/build.py` reports 14 of. Link-following retrieval is weakest
# there by construction, and a set without them would flatter the graph.

[[query]]
question = "How do I sign an AEAT filing without AutoFirma?"
expected_pages = ["business/pyfirma"]

