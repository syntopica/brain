<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>brain graph</title>
    <style>
      :root {
        --bg: #12141a;
        --panel: #1a1d26;
        --text: #d8dbe4;
        --dim: #7a8093;
        --project: #5b9dd9;
        --business: #d9a45b;
        --person: #c777c7;
        --topic: #63b98a;
        --personal: #d96a6a;
        --edge: rgba(160, 170, 195, 0.16);
        --accent: #8ab4f8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        overflow: hidden;
        color: var(--text);
        font:
          13px/1.45 -apple-system,
          system-ui,
          sans-serif;
      }
      #c {
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #hud {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        align-items: center;
        gap: 14px;
        background: linear-gradient(var(--bg) 70%, transparent);
        padding: 10px 14px;
        pointer-events: none;
      }
      #hud > * {
        pointer-events: auto;
      }
      #hud b {
        font-weight: 600;
      }
      #q {
        outline: none;
        border: 1px solid #2a2e3b;
        border-radius: 6px;
        background: var(--panel);
        padding: 5px 10px;
        width: 220px;
        color: var(--text);
      }
      #q:focus {
        border-color: var(--accent);
      }
      #stats {
        color: var(--dim);
      }
      #legend {
        display: flex;
        gap: 10px;
        color: var(--dim);
      }
      .sw {
        display: inline-block;
        vertical-align: -1px;
        margin-right: 4px;
        border-radius: 50%;
        width: 9px;
        height: 9px;
      }
      #side {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        border-left: 1px solid #2a2e3b;
        background: var(--panel);
        padding: 16px;
        width: 300px;
        overflow: auto;
      }
      #side h2 {
        margin-bottom: 2px;
        font-size: 15px;
      }
      #side .meta {
        margin-bottom: 10px;
        color: var(--dim);
      }
      #side h3 {
        margin: 12px 0 4px;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #side a {
        display: block;
        cursor: pointer;
        padding: 1px 0;
        color: var(--accent);
        text-decoration: none;
      }
      .orphan-note {
        margin-top: 8px;
        color: var(--personal);
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <b>brain graph</b>
      <input id="q" placeholder="filter pages…" />
      <span id="stats"></span>
      <span id="legend"></span>
    </div>
    <div id="side"></div>
    <script>
      const DATA = /*__DATA__*/;
      const COLORS = { project:'#5b9dd9', business:'#d9a45b', person:'#c777c7', topic:'#63b98a', personal:'#d96a6a' };
      const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
      let W, H, dpr = window.devicePixelRatio || 1;
      function resize(){ W = innerWidth; H = innerHeight; canvas.width = W*dpr; canvas.height = H*dpr;
        canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
      resize(); addEventListener('resize', resize);

      const nodes = DATA.nodes.map(n => ({...n, x:(Math.random()-.5)*600, y:(Math.random()-.5)*600, vx:0, vy:0,
        r: 4 + Math.sqrt(n.in)*2.2 }));
      const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
      const edges = DATA.edges.map(([s,t]) => [byId[s], byId[t]]);
      const neighbors = {}; nodes.forEach(n => neighbors[n.id] = new Set());
      edges.forEach(([s,t]) => { neighbors[s.id].add(t.id); neighbors[t.id].add(s.id); });

      let cam = { x:0, y:0, k:1 }, hover = null, selected = null, filter = '';

      function step(){
        for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
          const a=nodes[i], b=nodes[j]; let dx=b.x-a.x, dy=b.y-a.y;
          let d2 = dx*dx+dy*dy || 1; if (d2 > 250000) continue;
          const f = 1400/d2, d = Math.sqrt(d2);
          dx/=d; dy/=d; a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f;
        }
        for (const [s,t] of edges){
          let dx=t.x-s.x, dy=t.y-s.y; const d = Math.sqrt(dx*dx+dy*dy)||1;
          const f = (d-90)*0.004; dx/=d; dy/=d;
          s.vx += dx*f*d*0.02; s.vy += dy*f*d*0.02; t.vx -= dx*f*d*0.02; t.vy -= dy*f*d*0.02;
        }
        for (const n of nodes){
          n.vx -= n.x*0.0009; n.vy -= n.y*0.0009;
          if (n !== drag.node){ n.x += n.vx *= 0.85; n.y += n.vy *= 0.85; }
        }
      }

      function visible(n){ return !filter || n.id.includes(filter) || n.title.toLowerCase().includes(filter); }

      function draw(){
        ctx.clearRect(0,0,W,H); ctx.save();
        ctx.translate(W/2 + cam.x, H/2 + cam.y); ctx.scale(cam.k, cam.k);
        const focus = selected || hover;
        for (const [s,t] of edges){
          const lit = focus && (s===focus || t===focus);
          if (filter && !(visible(s)&&visible(t))) continue;
          ctx.strokeStyle = lit ? 'rgba(138,180,248,.55)' : 'var(--edge)';
          ctx.strokeStyle = lit ? 'rgba(138,180,248,.55)' : 'rgba(160,170,195,.14)';
          ctx.lineWidth = lit ? 1.4/cam.k : 0.7/cam.k;
          ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y); ctx.stroke();
        }
        for (const n of nodes){
          const dim = (filter && !visible(n)) || (focus && n!==focus && !neighbors[focus.id].has(n.id));
          ctx.globalAlpha = dim ? 0.15 : 1;
          ctx.fillStyle = COLORS[n.type] || '#999';
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
          if (n.in === 0){ ctx.strokeStyle = '#d96a6a'; ctx.lineWidth = 1.6/cam.k;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r+2.5/cam.k, 0, 7); ctx.stroke(); }
          if (cam.k > 0.55 || n === focus || (!dim && n.in >= 5)){
            ctx.fillStyle = dim ? 'rgba(216,219,228,.25)' : '#d8dbe4';
            ctx.font = `${11/cam.k}px system-ui`;
            ctx.fillText(n.id.split('/')[1], n.x + n.r + 4/cam.k, n.y + 3/cam.k);
          }
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function pick(mx, my){
        const x = (mx - W/2 - cam.x)/cam.k, y = (my - H/2 - cam.y)/cam.k;
        let best = null, bd = 12/cam.k;
        for (const n of nodes){ const d = Math.hypot(n.x-x, n.y-y); if (d < n.r + bd && (!best || d < bd)){ best = n; bd = d; } }
        return best;
      }

      const drag = { node:null, pan:false, px:0, py:0 };
      canvas.addEventListener('mousedown', e => { const n = pick(e.clientX, e.clientY);
        if (n){ drag.node = n; } else { drag.pan = true; } drag.px = e.clientX; drag.py = e.clientY; });
      addEventListener('mousemove', e => {
        if (drag.node){ drag.node.x += (e.clientX-drag.px)/cam.k; drag.node.y += (e.clientY-drag.py)/cam.k; }
        else if (drag.pan){ cam.x += e.clientX-drag.px; cam.y += e.clientY-drag.py; }
        else hover = pick(e.clientX, e.clientY);
        drag.px = e.clientX; drag.py = e.clientY;
        canvas.style.cursor = hover ? 'pointer' : 'grab';
      });
      addEventListener('mouseup', e => {
        if (drag.node && Math.hypot(e.clientX-drag.px, e.clientY-drag.py) < 3) select(drag.node);
        else if (drag.pan === true && hover === null){}
        drag.node = null; drag.pan = false;
      });
      canvas.addEventListener('click', e => { const n = pick(e.clientX, e.clientY); if (n) select(n); else { selected = null; side.style.display='none'; } });
      canvas.addEventListener('wheel', e => { e.preventDefault();
        const k = Math.min(4, Math.max(0.15, cam.k * (e.deltaY < 0 ? 1.12 : 0.89)));
        cam.x = (cam.x)*(k/cam.k); cam.y = (cam.y)*(k/cam.k); cam.k = k; }, { passive:false });

      // Touch: one finger drags a node or pans; two fingers pinch-zoom; a
      // short tap selects. Wired separately from the mouse path because the
      // graph is read on phones over the tailnet.
      let pinch = null, tap = null;
      canvas.addEventListener('touchstart', e => { e.preventDefault();
        if (e.touches.length === 1){
          const t = e.touches[0], n = pick(t.clientX, t.clientY);
          if (n) drag.node = n; else drag.pan = true;
          drag.px = t.clientX; drag.py = t.clientY;
          tap = { x: t.clientX, y: t.clientY, node: n };
        } else if (e.touches.length === 2){
          drag.node = null; drag.pan = false; tap = null;
          pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
        }
      }, { passive:false });
      canvas.addEventListener('touchmove', e => { e.preventDefault();
        if (e.touches.length === 1 && !pinch){
          const t = e.touches[0];
          if (drag.node){ drag.node.x += (t.clientX-drag.px)/cam.k; drag.node.y += (t.clientY-drag.py)/cam.k; }
          else if (drag.pan){ cam.x += t.clientX-drag.px; cam.y += t.clientY-drag.py; }
          drag.px = t.clientX; drag.py = t.clientY;
          if (tap && Math.hypot(t.clientX-tap.x, t.clientY-tap.y) > 8) tap = null;
        } else if (e.touches.length === 2){
          const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                               e.touches[0].clientY - e.touches[1].clientY);
          if (pinch){ const k = Math.min(4, Math.max(0.15, cam.k * d/pinch));
            cam.x *= k/cam.k; cam.y *= k/cam.k; cam.k = k; }
          pinch = d;
        }
      }, { passive:false });
      canvas.addEventListener('touchend', e => {
        if (e.touches.length === 0){
          if (tap){ if (tap.node) select(tap.node); else { selected = null; side.style.display='none'; } }
          drag.node = null; drag.pan = false; pinch = null; tap = null;
        } else if (e.touches.length === 1){ pinch = null; }
      });

      const side = document.getElementById('side');
      function select(n){
        selected = n; side.style.display = 'block';
        const links = to => `<a onclick="select(byId['${to}'])">${to}</a>`;
        const inbound = edges.filter(([s,t]) => t===n).map(([s]) => s.id);
        const outbound = edges.filter(([s]) => s===n).map(([,t]) => t.id);
        side.innerHTML = `<h2>${n.title}</h2>
          <div class="meta">${n.id} · ${n.type}${n.updated ? ' · updated '+n.updated : ''}</div>
          <h3>linked from (${inbound.length})</h3>${inbound.map(links).join('') || '<span class="orphan-note">orphan — nothing links here</span>'}
          <h3>links to (${outbound.length})</h3>${outbound.map(links).join('') || '—'}`;
      }
      window.select = select; window.byId = byId;

      document.getElementById('q').addEventListener('input', e => { filter = e.target.value.trim().toLowerCase(); });
      document.getElementById('stats').textContent =
        `${DATA.nodes.length} pages · ${DATA.edges.length} links · ${DATA.orphans.length} orphans · ${DATA.dangling.length} dangling`;
      document.getElementById('legend').innerHTML = Object.entries(COLORS)
        .map(([t,c]) => `<span><span class="sw" style="background:${c}"></span>${t}</span>`).join('');

      (function loop(){ step(); draw(); requestAnimationFrame(loop); })();
    </script>
  </body>
</html>
