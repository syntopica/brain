; Managed by codeality-py.
[mypy]
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^dist/|/migrations/)
; tools/ is a pile of scripts, not a package: two of them are named build.py,
; and mypy stops at "Duplicate module" unless each file stands on its own.
namespace_packages = True
explicit_package_bases = True
mypy_path = .
ignore_missing_imports = True
follow_imports = silent

[mypy-tests.*]
disallow_untyped_defs = False

; Adoption ratchet, 2026-09-01: 469 errors in strict mode across 47 files,
; nearly all missing annotations. Fix a module, delete its section; never
; add one.
;
; 2026-09-08: the twenty hyphenated scripts were renamed, so the seventeen
; that carried an inline "# mypy: ignore-errors" header now carry a section
; here instead - the same tolerance, one line each, so it can be retired one
; module at a time. Four of them sit under a hyphenated directory
; (tools/review-pass, tools/mobile-shortcut), which mypy names by the file
; alone: their sections are the bare module name, not a dotted path.