# Managed by baseline-py. Rules are listed explicitly: ALL expands silently on
# every ruff upgrade, turning a dependency bump into a lint failure.
line-length = 100
target-version = "py312"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "A",    # builtin shadowing
  "C4",   # comprehensions
  "DTZ",  # naive datetimes
  "T20",  # print in library code
  "SIM",  # simplifiable code
  "RET",  # return control flow
  "ARG",  # unused arguments
  "PTH",  # pathlib over os.path
  "ERA",  # commented-out code
  "PL",   # pylint: complexity, branches, statements
  "RUF",  # ruff-specific
  "D",    # docstrings; replaces interrogate
  # bandit, curated: the full S set is intentionally noisy in tests and in
  # subprocess-heavy code.
  "S102", "S103", "S104", "S105", "S106", "S107", "S108",
  "S301", "S302", "S303", "S304", "S305", "S306",
  "S324", "S501", "S506", "S508", "S509",
  "S608", "S609", "S612",
]
ignore = [
  # Project decisions, permanent. These are commands a person runs from a
  # terminal: print is how they report, and several import a heavy optional
  # dependency only on the path that needs it.
  "T201",
  "PLC0415",

  # Adoption ratchet, 2026-09-01. Each line is debt with the count the pass
  # found, not a decision. Fix a family, delete its line; never add one. The
  # defect families - leaked handles, unstated subprocess intent, dropped
  # exception causes, dead imports - were fixed rather than listed here.
  "D1",       # 157 undocumented functions, methods and modules
  "D205", "D301",  # 23 docstring layout
  "PLR2004",  # 28 magic values, mostly HTTP codes and column indices
  "PTH",      # 58 os.path call sites predating pathlib
  "E402",     # 15 imports after a sys.path line the import depends on
  "S108",     # 5  /tmp paths in developer-only batch tools
  "PLR0913", "PLR0917",  # 10 argument-heavy AEAT and TGSS entry points
  "PLR0911", "PLR0912", "PLR0915",  # oversized functions
  "SIM102", "SIM105", "SIM108", "SIM110",  # small rewrites
  "DTZ005", "DTZ011", "DTZ012",  # naive dates in local-time reports
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode in Spanish text
  "B007", "B905", "PLW2901", "UP031", "S608", "ARG001", "RET504", "N806",

  # Conflicts with the formatter; keeping these on fights ruff format forever.
  "E501", "W191", "E111", "E114", "E117", "D206", "D300", "COM812", "ISC001",
  "D203",  # incompatible with D211
  "D107",  # an __init__ that stores its arguments has nothing to add to the class docstring
  "D213",  # incompatible with D212
]

[lint.per-file-ignores]
# **/ so the pattern also reaches nested test roots such as host/tests.
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "ARG", "PLR"]
"**/conftest.py" = ["D"]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
