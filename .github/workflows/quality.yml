name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: python gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      # Every extra and every group: the gate audits and tests the environment
      # it runs in, and a group-only install leaves out the extras the tests
      # import.
      - name: Install from the lockfile
        run: uv sync --locked --all-extras --all-groups
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run the quality gate
        run: uv run codeality-py gate --json

  instance:
    name: index + graph + doctor on a synthetic instance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install from the lockfile
        run: uv sync --locked --all-extras --all-groups

      # The engine is run against an instance it builds itself, never against
      # anyone's wiki: this job has no credential that could reach one.
      - name: Build a synthetic instance and run the engine over it
        run: |
          uv run python - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from tests.fixtures.make_data_directory import make_data_directory
          print(make_data_directory(Path("ci-instance").resolve()))
          PYTHON
          uv run python tools/index/build.py --data ci-instance/data --check
          uv run python tools/graph/build.py --data ci-instance/data
          ./bin/brain --data ci-instance/data doctor

  security:
    name: secrets + workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks cannot see a secret committed three commits ago
      # from a shallow clone.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --no-banner --redact

      # actionlint checks workflow syntax; zizmor checks workflow security -
      # template injection, unpinned actions, over-broad token permissions.
      # Neither subsumes the other.
      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
